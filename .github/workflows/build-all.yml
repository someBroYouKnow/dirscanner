name: Multi-Platform Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dir-scanner-linux

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dir-scanner-windows.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dir-scanner-macos-m1

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dir-scanner-macos-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 🔴 FIX: macOS cross-compilation needs this
      - name: Install macOS cross toolchain (Intel target)
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact Path
        shell: bash
        run: |
          mkdir -p output

          BIN_NAME="dir-scanner"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN_NAME="dir-scanner.exe"
          fi

          cp target/${{ matrix.target }}/release/$BIN_NAME output/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/${{ matrix.artifact_name }}

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure (debug)
        run: ls -R

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dir-scanner-windows.exe/dir-scanner-windows.exe
            dir-scanner-linux/dir-scanner-linux
            dir-scanner-macos-m1/dir-scanner-macos-m1
            dir-scanner-macos-intel/dir-scanner-macos-intel
          generate_release_notes: true
          draft: false