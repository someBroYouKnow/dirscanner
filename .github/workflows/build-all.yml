name: Multi-Platform Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # If one build fails, don't cancel the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dir-scanner-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dir-scanner-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dir-scanner-macos-m1 # For Silicon Macs
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dir-scanner-macos-intel # For Intel Macs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact Path
        shell: bash
        run: |
          # Create a clean directory for the output
          mkdir -p output
          # Handle Windows naming (.exe) vs Unix naming
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/dir-scanner.exe output/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/dir-scanner output/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/